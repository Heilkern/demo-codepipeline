# deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-nginx-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-nginx-demo
  template:
    metadata:
      labels:
        app: my-nginx-demo
    spec:
      containers:
      - name: my-nginx-demo
        image: 876108003052.dkr.ecr.ap-northeast-2.amazonaws.com/my-nginx-demo:latest
        ports:
        - containerPort: 80
